# Fan headers are board-specific — which one is the CPU fan differs per model.
# Format:  <hwmon-name>.<fan> = label      (or just  <fan> = label)
# Find yours with:  sensors  /  grep . /sys/class/hwmon/hwmon*/fan*_input
#
# Anything not named here shows up under its raw sysfs name, which is fine —
# labels only exist to make an alert readable at 3am.

it8688.fan3 = chassis / drive array
it8688.fan5 = CPU
