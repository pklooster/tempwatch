# tempwatch thresholds — copy to ~/.config/tempwatch/thresholds.conf
# Values are °C. warn = orange, crit = red + Telegram ping.
# Edited values take effect on the next run; nothing to restart.

# CPU package/die (k10temp Tctl/Tccd on AMD, coretemp on Intel).
# Pick something below your chip's own throttle point so you hear about it
# first — most desktop parts throttle at 95-100°C.
CPU_WARN=80
CPU_CRIT=90

# Motherboard / chipset / VRM sensors. These are unlabelled on most boards
# and some of them read nonsense; watch them for a week before trusting one.
BOARD_WARN=75
BOARD_CRIT=90

# Onboard NIC. Spec max is usually 120°C, so this is only a sanity net.
NIC_WARN=95
NIC_CRIT=110

# Spinning disks. Manufacturer max is typically 60°C. Set WARN to just above
# what your array actually idles at, or you will train yourself to ignore it.
HDD_WARN=50
HDD_CRIT=58

# NVMe fallback only — drives that report their own limits override these.
NVME_WARN=70
NVME_CRIT=85

# Re-ping interval (seconds) while a sensor stays critical. 0 = every run.
CRIT_REPEAT=1800

# Watch mode: re-poll SATA disks every N seconds (smartctl is the slow part).
DISK_EVERY=30

# acpitz is a fixed bogus value on many boards — off by default.
SHOW_ACPITZ=0

# Lines kept in temp.log.
LOG_KEEP=5000

# Uncomment to share Telegram credentials with another tool instead of
# keeping a second copy in ~/.config/tempwatch/telegram.env:
#ENV_FILE=/root/.config/site-monitor/telegram.env
